:root{color-scheme:light;--paper:#f4f1e9;--sheet:#fdfcf8;--ink:#25271f;--muted:#66695e;--rule:#d8d8ca;--accent:#c24827;--accent-soft:#f6e6db;--positive:#39664e;--danger:#ac3939;--sans:Plex,Inter,system-ui,sans-serif;--side:#ebe9de;--note:#eceacb;--note-line:#cecea9;--dark-ink:#25271f;--cream:#f6f3e9;--app-height:100dvh;--motion:180ms;--ease:cubic-bezier(.2,.7,.25,1)}

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none}body{background:var(--paper);color:var(--ink);font:14px var(--sans);-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;background:none;color:inherit;border:0}a{color:inherit;text-decoration:none}button,a{touch-action:manipulation;transition:background var(--motion),color var(--motion),border-color var(--motion),opacity var(--motion)}button:disabled{cursor:default;opacity:.45}input,textarea,select{color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:7px}textarea{resize:vertical}input,textarea,select,button,a{outline-offset:4px}:focus-visible{outline:2px solid var(--accent)}h1,h2,h3,p{margin:0}h1,h2,h3{font-weight:600}p{line-height:1.9}::selection{background:var(--accent-soft);color:var(--accent)}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex-shrink:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.skip{position:fixed;top:-100px;right:20px;background:var(--ink);color:var(--paper);padding:12px 20px;z-index:100}.skip:focus{top:10px}.shell{height:var(--app-height);display:flex;flex-direction:column;overflow:clip}.masthead{height:88px;padding:0 44px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--rule);flex-shrink:0}.wordmark{display:flex;gap:10px;align-items:center}.brand-symbol{width:39px;height:44px;display:block;color:var(--ink)}.brand-symbol svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:3}.brand-symbol .brand-dot{fill:var(--accent);stroke:none}.wordmark-copy{font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.8px;white-space:nowrap}.wordmark-copy b{font-family:Inter,sans-serif;font-size:19px;font-weight:400;letter-spacing:-1px}.wordmark-copy small{display:block;font-size:8px;font-weight:400;letter-spacing:2px;color:var(--muted);line-height:1.8;margin-top:3px}.header-nav{height:100%;display:flex;align-items:center;gap:32px}.header-nav a{height:100%;display:flex;align-items:center;gap:8px;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:12px;color:var(--muted)}.header-nav a.active{color:var(--ink);border-bottom-color:var(--accent)}.header-nav a .nav-index{font:9px Inter,sans-serif;color:var(--muted);opacity:.8}.header-actions{display:flex;align-items:center;gap:7px}.header-divider{height:22px;width:1px;background:var(--rule);margin:0 8px}.icon-btn{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}.icon-btn:hover{background:var(--side);color:var(--ink)}.lang-btn{font:500 10px Inter,sans-serif}.avatar-btn{width:37px;height:37px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);background:var(--side);border-radius:50%;font-size:16px;color:var(--ink)}.mobile-dock{display:none}.statusbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 44px;border-top:1px solid var(--rule);font-size:10px;color:var(--muted);flex-shrink:0}.statusbar>span,.statusbar>a{display:inline-flex;align-items:center;gap:7px}.status-dot{width:5px;height:5px;border-radius:50%;background:var(--positive)}.statusbar .icon{width:12px;height:12px}#view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;outline:none;scrollbar-width:thin;scroll-padding:30px}.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 19px;border:1px solid var(--rule);border-radius:7px;font-size:12px;font-weight:500;white-space:nowrap}.btn .icon{width:16px;height:16px}.btn-ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}.btn-ink:hover{backgroun function inline(text){return esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\x60([^\x60]+)\x60/g,'<code dir="ltr">$1</code>');}
function markdown(text){
 return text.split(BT.repeat(3)).map((block,part)=>{
  if(part%2){const lines=block.split('\n'),language=lines.shift();return '<div class="code-block"><div class="code-bar"><span>'+esc(language||'text')+'</span><button data-action="copy-code">'+icon('copy')+t('نسخ الكود','Copy code')+'</button></div><pre tabindex="0"><code>'+esc(lines.join('\n').trim())+'</code></pre></div>';}
  const lines=block.split('\n');let html='',list='';
  const close=()=>{if(list){html+='</'+list+'>';list='';}};
  for(let i=0;i<lines.length;i++){
   const line=lines[i].trim();if(!line){close();continue;}
   if(line.startsWith('|')&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1]||'')){
    close();const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
    html+='<div class="table-wrapper" role="region" tabindex="0" aria-label="'+t('جدول قابل للتمرير','Scrollable table')+'"><table><thead><tr>'+cells(line).map(c=>'<th scope="col">'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
    i+=2;for(;i<lines.length&&lines[i].trim().startsWith('|');i++)html+='<tr>'+cells(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
    i--;html+='</tbody></table></div>';continue;
   }
   const heading=line.match(/^(#{1,3})\s+(.*)/);
   if(heading){close();const tag=heading[1].length<3?'h2':'h3';html+='<'+tag+'>'+inline(heading[2])+'</'+tag+'>';continue;}
   const item=line.match(/^(- |\d+\. )(.*)/);
   if(item){const type=item[1]==='- '?'ul':'ol';if(type!==list){close();list=type;html+='<'+type+'>';}html+='<li>'+inline(item[2])+'</li>';continue;}
   close();html+=line.startsWith('> ')?'<blockquote>'+inline(line.slice(2))+'</blockquote>':'<p>'+inline(line)+'</p>';
  }close();return html;
 }).join('');
}

function send(){
 if(pending?.chatId===state.activeChat){stop();return;}
 const input=$('#inquiry'),question=input?.value.trim();if(!question)return;
 const wasFocused=document.activeElement===input,wasReading=!!$('#messages');
 if(pending){toast(t('في رد قيد العرض بمحادثة تانية. انتظر اكتماله أو أوقفه.','A response is playing in another conversation. Wait or stop it first.'));return;}
 if(!active()){
  state.activeChat='thought-'+Date.now();
  state.chats.unshift({id:state.activeChat,title:question.slice(0,45),category:state.mode==='code'?'code':'study',date:new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo'}).format(new Date()),exchanges:[]});
  delete state.drafts.new;
 }
 const chat=active();
 chat.exchanges.push({q:question+(attached?'\n['+t('مرفق محلي: ','Local filename: ')+attached+']':''),a:'',loading:true});
 state.drafts[state.activeChat]='';attached=null;
 const fail=errorNext;errorNext=false;
 pending={chatId:chat.id,index:chat.exchanges.length-1,timer:null};
 save();
 if(wasReading){
  input.value='';input.dir=document.documentElement.dir;resizeInput();$('.attachment-name')?.remove();updateMessages(true);
 }else{

 }

function startResponse(chat,answer,fail=false){
 pending.timer=setTimeout(()=>{
  if(!pending)return;
  const e=chat.exchanges[pending.index];e.loading=false;
  if(fail){e.error=true;pending=null;save();if(state.activeChat===chat.id&&route==='studio')updateMessages(true);updateAsk();live(t('حدث خطأ تجريبي. يمكنك إعادة المحاولة.','Demo error. You can try again.'));return;}
  e.streaming=true;const words=answer.split(' ');let count=0;
  function tick(){
   if(!pending)return;
   count=Math.min(count+8,words.length);e.a=words.slice(0,count).join(' ');
   if(count===words.length){e.streaming=false;pending=null;save();live(t('اكتمل عرض الرد التجريبي.','The demo response is complete.'));}
   if(state.activeChat===chat.id&&route==='studio')updateMessages();
   updateAsk();if(pending)pending.timer=setTimeout(tick,40);
  }tick();
 },600);
}
function stop(){

 if(exchange){exchange.loading=false;exchange.streaming=false;exchange.a=exchange.a||t('تم إيقاف عرض الرد التجريبي.','The demo response was stopped.');}

}

document.addEventListener('click',event=>{
 const action=event.target.closest('[data-action]');
 if(action){event.preventDefault();actions[action.dataset.action]?.(action);return;}
 const anchor=event.target.closest('a[href^="#"]');
 if(anchor&&anchor.hash!=='#view'){event.preventDefault();navigate(anchor.hash.slice(1));}
});
document.addEventListener('input',event=>{
 const input=event.target;
 if(input.id==='inquiry'){input.dir=input.value?'auto':document.documentElement.dir;state.drafts[state.activeChat||'new']=input.value;resizeInput();updateAsk();save();}
 if(input.id==='fieldnote'||input.id==='mobile-fieldnote'){state.notes=input.value;save();const other=input.id==='fieldnote'?$('#mobile-fieldnote'):$('#fieldnote');if(other)other.value=input.value;}
 if(input.id==='archive-search'){archiveQuery=input.value;const list=state.chats.filter(c=>(archiveFilter==='all'||c.category===archiveFilter)&&(c.title+' '+c.exchanges.map(e=>e.q).join(' ')).toLowerCase().includes(archiveQuery.toLowerCase()));$('#archive-results').innerHTML=archiveRows(list);}
});
document.addEventListener('submit',event=>{if(event.target.id==='question-form'){event.preventDefault();send();}});
document.addEventListener('keydown',event=>{
 if(event.target.id==='inquiry'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();if(pending?.chatId===state.activeChat){toast(t('كمّل كتابة، وبعد اكتمال الرد ابعت سؤالك الجديد.','Keep writing. Send your next question when the response finishes.'));return;}send();}
 if($('#dialog').open)return;
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();actions.commands();}
 if((event.ctrlKey||event.metaKey)&&event.shiftKey&&event.key.toLowerCase()==='n'){event.preventDefault();newChat();}
 if(event.key==='/'&&!event.target.matches('input,textarea,select,[contenteditable]')){event.preventDefault();navigate('history');$('#archive-search').focus({preventScroll:true});}
});
document.addEventListener('pointerdown',event=>{if(event.target.closest('#ask-button')&&document.activeElement?.id==='inquiry')event.preventDefault();});
$('#dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
$('#dialog').addEventListener('click',event=>{if(event.target!==$('#dialog'))return;const r=$('#dialog').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();});
$('#file-picker').addEventListener('change',event=>{
 const file=event.target.files[0];if(!file)return;
 if(file.size>1024*1024||!/\.(txt|md|csv)$/i.test(file.name)){toast(t('اختر ملف TXT أو MD أو CSV أصغر من ١ ميجابايت.','Choose a TXT, MD, or CSV file smaller than 1 MB.'));event.target.value='';return;}
 attached=file.name;render();toast(t('تم إرفاق اسم الملف فقط. لم يُقرأ محتواه أو يُرفع.','Filename attached only. Its contents were not read or uploaded.'));event.target.value='';
});
let viewportBaseline=innerHeight,viewportWidth=innerWidth;
function syncViewport(){
 if(!window.visualViewport||innerWidth>850){document.documentElement.style.removeProperty('--app-height');$('#shell').classList.remove('keyboard-open');return;}
 const vp=window.visualViewport;if(vp.scale!==1)return;
 if(Math.abs(innerWidth-viewportWidth)>80){viewportBaseline=vp.height;viewportWidth=innerWidth;}
 viewportBaseline=Math.max(viewportBaseline,vp.height);
 document.documentElement.style.setProperty('--app-height',Math.round(vp.height)+'px');
 $('#shell').classList.toggle('keyboard-open',document.activeElement?.id==='inquiry'&&viewportBaseline-vp.height>140);
}
window.visualViewport?.addEventListener('resize',syncViewport,{passive:true});
window.addEventListener('resize',syncViewport,{passive:true});
document.addEventListener('focusin',syncViewport);document.addEventListener('focusout',()=>requestAnimationFrame(syncViewport));
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
window.Taiba={state,icon,esc,t,save,toast,navigate,render,setTheme,dialog,closeDialog};
document.addEventListener('DOMContentLoaded',()=>{render();syncViewport();setInterval(updateFocusDOM,1000);});

</script>

  document.addEventListener('submit',async event=>{
    const form=event.target;if(!form.matches('[data-s-form]'))return;
    event.preventDefault();const type=form.dataset.sForm;
    if(type==='profile'){
      const name=document.getElementById('s-profile-name').value.trim();
      if(name.length<2||name.length>60){invalid('s-profile-name',t('اكتب اسمًا بين حرفين و٦٠ حرفًا.','Use a name between 2 and 60 characters.'));setFeedback('s-profile-feedback',t('راجع اسم العرض قبل الحفظ.','Check the display name before saving.'));return;}
      A().state.profile.name=name;A().save();A().render();A().toast(t('تفاصيلك اتحفظت.','Your details are saved.'));
    }
    if(type==='login'){
      const email=document.getElementById('s-login-email').value.trim(),password=document.getElementById('s-login-password').value;
      const emailError=email!==A().state.profile.email,passwordError=password!=='TaibaDemo2026!';
      invalid('s-login-email',emailError?t('استخدم بريد العرض الموضّح أعلاه.','Use the demo email shown above.'):'');
      invalid('s-login-password',passwordError?t('استخدم TaibaDemo2026! فقط.','Use TaibaDemo2026! only.'):'');
      if(emailError||passwordError){setFeedback('s-login-feedback',t('بيانات العرض غير مطابقة. لا تدخل بيانات حقيقية.','The sample credentials do not match. Never use real credentials.'));return;}
      const button=form.querySelector('[type=submit]');button.disabled=true;button.setAttribute('aria-busy','true');button.textContent=t('نفتح مساحة الأفكار…','Opening your space…');
      await new Promise(resolve=>setTimeout(resolve,700));
      if(form.isConnected){form.reset();A().navigate('studio');A().toast(t('أهلًا في رواقك. دي تجربة واجهة، بدون مصادقة فعلية.','Welcome to your studio. This is a UI demo without real authentication.'));}
    }
    if(type==='password'){
      const temporary=document.getElementById('s-temporary').value,next=document.getElementById('s-new').value,confirm=document.getElementById('s-confirm').value;
      const errors=[temporary==='TaibaDemo2026!'?'':t('استخدم كلمة العرض المؤقتة TaibaDemo2026!','Use the temporary demo value TaibaDemo2026!'),next.length<12?t('١٢ حرفًا على الأقل.','At least 12 characters required.'):next===temporary?t('اختار كلمة مختلفة عن المؤقتة.','Choose a different password from the temporary value.'):'',!confirm||next!==confirm?t('التأكيد غير مطابق.','The confirmation does not match.'):''];
      ['s-temporary','s-new','s-confirm'].forEach((id,n)=>invalid(id,errors[n]));
      if(errors.some(Boolean)){setFeedback('s-password-feedback',t('راجع الحقول المعلّمة قبل المتابعة.','Review the marked fields before continuing.'));return;}
      form.reset();setFeedback('s-password-feedback',t('نجح التحقق التجريبي. لم تُحفظ أو تُرسل كلمة مرور، وبيانات الدخول التجريبية لم تتغيّر.','Demo validation succeeded. No password was saved or sent, and the sample sign-in credentials have not changed.'),true);
    }
    if(type==='student'){
      const name=document.getElementById('s-student-name').value.trim(),input=document.getElementById('s-student-email'),email=input.value.trim(),faculty=document.getElementById('s-student-program').value;
      invalid('s-student-name',name.length<2?t('حرفان على الأقل.','At least 2 characters.'):'');invalid('s-student-email',!email||!input.validity.valid?t('اكتب بريدًا صالح الصيغة.','Enter a valid email address.'):'');
      if(name.length<2||!email||!input.validity.valid){setFeedback('s-student-feedback',t('راجع الاسم والبريد التجريبي.','Review the sample name and email.'));return;}
      if(A().state.students.some(s=>s.email.toLowerCase()===email.toLowerCase()&&String(s.id)!==form.dataset.id)){setFeedback('s-student-feedback',t('البريد موجود بالفعل في النموذج.','That email already exists in the demo.'));return;}
      const student=A().state.students.find(s=>String(s.id)===form.dataset.id);
      if(student)Object.assign(student,{name,email,faculty});
      else A().state.students.unshift({id:'s-'+Date.now(),name,email,faculty,active:true});
      A().save();A().closeDialog();A().render();A().toast(t('تم حفظ بطاقة الطالب محليًا.','Student details saved locally.'));
    }
    if(type==='announcement'){
      const title=document.getElementById('s-news-title').value.trim(),body=document.getElementById('s-news-body').value.trim(),kind=document.getElementById('s-news-kind').value;
      invalid('s-news-title',title.length<4?t('العنوان ٤ أحرف على الأقل.','Use at least 4 characters.'):'');
      if(title.length<4||body.length<10){setFeedback('s-news-feedback',t('العنوان ٤ أحرف على الأقل، والتفاصيل ١٠ أحرف.','Use at least 4 characters for the title and 10 for the details.'));return;}
      const current=A().state.announcements.find(a=>String(a.id)===form.dataset.id);
      const data={title,body,kind,date:new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())};
      if(current)Object.assign(current,data);else A().state.announcements.unshift({id:'a-'+Date.now(),...data});
      A().save();A().closeDialog();A().render();A().toast(t('النشرة اتنشرت محليًا.','Announcement published locally.'));
    }
  });
  window.TaibaScreens={
    render(route){initialize();return route==='profile'?profile():route==='login'?login():route==='password'?password():admin();},
    resetTab(){adminSection='overview';studentQuery='';providerQuery='';}
  };
})();

</script>
</body>
</html>
